<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카메라 물품 위치 조회</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header class="app-header">
<h1>물품코드 스캐너</h1>
<div id="excelStatus" role="status">엑셀 확인 중…</div>
</header>
<nav class="tabs mode-tabs" aria-label="이미지 입력 방식">
<button type="button" data-tab="camera" aria-pressed="true">카메라</button>
<button type="button" data-tab="photo" aria-pressed="false">사진</button>
<button type="button" data-tab="test" aria-pressed="false">테스트</button>
</nav>
<div class="mode-controls" id="cameraControls">
<button id="start" type="button">카메라 켜기</button>
<button id="stop" type="button" disabled>끄기</button>
<button id="resume" type="button" hidden disabled>다시 촬영</button>
</div>
<div class="mode-controls" id="photoControls" hidden>
<label class="file-button" for="photoInput">사진 선택</label>
<input id="photoInput" class="visually-hidden" type="file" accept="image/*">
<span class="mode-note">선택한 사진은 기기에서 처리됩니다.</span>
</div>
<div class="mode-controls test-controls" id="testControls" hidden>
<label>코드 <input id="testCount" type="number" min="1" max="12" value="3"></label>
<label>배치 <select id="testLayout"><option value="grid">격자</option><option value="random">무작위</option><option value="column">세로</option></select></label>
<label>노이즈 <input id="testNoise" type="range" min="0" max="100" step="10" value="0"><output id="testNoiseValue">0%</output></label>
<button id="testGenerate" type="button">이미지 생성</button>
<button id="testExport" type="button">엑셀에서 추출</button>
</div>
<video id="camera" autoplay muted playsinline aria-hidden="true"></video>
<section id="workspace" aria-label="인식 이미지">
<div id="liveView">
<div id="liveSurface"><canvas id="liveCanvas" aria-busy="false"></canvas><div id="dots"></div></div>
<div id="liveStatus" role="status">카메라를 켜서 코드를 찾으세요.</div>
</div>
<div id="imageViewport" hidden aria-label="사진 보기 · 두 손가락 확대 및 이동 · 두 번 터치 인식">
<div id="frozen" hidden><canvas id="snapshot"></canvas><div id="boxes"></div></div>
</div>
<div id="boxVisibility" class="box-visibility" hidden>박스 표시</div>
<div id="zoomLevel" hidden>100%</div>
<div id="zoomHint" hidden>두 손가락 확대 · 두 번 터치 인식</div>
</section>
<div id="status" role="status" aria-live="polite">카메라를 켜거나 사진을 선택하세요.</div>
<nav class="tool-menu" aria-label="부가 기능">
<details class="tool-drawer" id="excelDrawer">
<summary>엑셀</summary>
<div class="drawer-body">
<h2>물품 위치 엑셀</h2>
<label for="excel">엑셀 선택 (A열 코드 · B열 위치)</label>
<input id="excel" type="file" accept=".xlsx,.xls">
<label id="sheetLabel" for="sheet" hidden>조회할 시트 <select id="sheet"></select></label>
<small>저장한 데이터는 같은 브라우저에서 자동 복원됩니다.</small>
</div>
</details>
<details class="tool-drawer" id="settingsDrawer">
<summary>인식 설정</summary>
<div class="drawer-body">
<h2>이미지 보정 · 정밀 인식</h2>
<label for="strength">영상·대비 강도 <output id="strengthValue">50</output>%</label>
<input id="strength" type="range" min="0" max="100" step="5" value="50">
<div id="advanced">
<nav class="tabs correction-tabs" aria-label="이미지 보정 방식">
<button type="button" data-filter-mode="print" aria-pressed="true">인쇄물</button>
<button type="button" data-filter-mode="contrast" aria-pressed="false">흑백 대비</button>
</nav>
<input type="hidden" id="filterMode" value="print">
<label for="brightness">밝기 <output id="brightnessValue">0</output></label>
<input id="brightness" type="range" min="-60" max="60" step="5" value="0">
<label for="threshold">인쇄물 글자 농도 <output id="thresholdValue">16</output></label>
<input id="threshold" type="range" min="4" max="32" step="2" value="16">
<label class="inline-label"><input id="removeLines" type="checkbox" checked> 표 테두리 완화</label>
<label class="inline-label"><input id="deepScan" type="checkbox" checked> 정밀 인식 · 6구역 확대 검사</label>
</div>
<div class="box-style-settings">
<h3>코드 박스</h3>
<label>글꼴 <select id="codeFont"><option value="monospace">고정폭</option><option value="sans-serif">기본</option><option value="serif">명조</option></select></label>
<label>글자 크기 <input id="codeSize" type="range" min="8" max="32" value="11"> <output id="codeSizeValue">11px</output></label>
<label>투명도 <input id="codeOpacity" type="range" min="10" max="100" step="5" value="65"> <output id="codeOpacityValue">65%</output></label>
<label>배경색 <input id="codeBg" type="color" value="#d1eadc"></label>
<label>글자 색상 <input id="codeColor" type="color" value="#111111"></label>
<label>테두리 <select id="codeBorder"><option value="solid">실선</option><option value="none">없음</option><option value="dashed">점선</option><option value="dotted">점점선</option><option value="double">이중선</option></select></label>
<h3>위치 박스</h3>
<label>글꼴 <select id="placeFont"><option value="sans-serif">기본</option><option value="monospace">고정폭</option><option value="serif">명조</option></select></label>
<label>글자 크기 <input id="placeSize" type="range" min="8" max="32" value="12"> <output id="placeSizeValue">12px</output></label>
<label>투명도 <input id="placeOpacity" type="range" min="10" max="100" step="5" value="100"> <output id="placeOpacityValue">100%</output></label>
<label>배경색 <input id="placeBg" type="color" value="#202b3c"></label>
<label>글자 색상 <input id="placeColor" type="color" value="#ffffff"></label>
<label>테두리 <select id="placeBorder"><option value="none">없음</option><option value="solid">실선</option><option value="dashed">점선</option><option value="dotted">점점선</option><option value="double">이중선</option></select></label>
</div>
<label>코드 박스 방향 (16방향 · 드래그)</label>
<div id="codeDial" class="location-dial" role="group" aria-label="코드 박스 표시 방향"></div>
<small id="codeDirection">원본 위치</small>
<label>위치 박스 방향 (16방향 · 드래그)</label>
<div id="locationDial" class="location-dial" role="group" aria-label="위치 박스 표시 방향"></div>
<small id="locationDirection">왼쪽</small>
<small>인쇄물 모드는 그림자를 보정합니다. 설정은 세 가지 입력 모드에 공통 적용됩니다.</small>
</div>
</details>
<details class="tool-drawer" id="resultsDrawer">
<summary>결과 <span id="count">0</span></summary>
<div class="drawer-body">
<h2>조회 기록</h2>
<div id="empty" class="empty">인식된 코드와 위치는 사진 위 박스에 표시됩니다.</div>
<div id="records"></div>
<div id="scanStats" class="empty"></div>
<details class="raw-details"><summary>OCR 상세 문자</summary><pre id="raw"></pre></details>
</div>
</details>
</nav>
<button id="readImage" type="button" disabled>코드 인식</button>
</main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"></script>
<script src="state.js"></script>
<script src="image.js"></script>
<script src="ocr.js"></script>
<script src="camera.js"></script>
<script src="photo.js"></script>
<script src="excel.js"></script>
<script src="records.js"></script>
<script src="app.js"></script>
</body>
</html>
